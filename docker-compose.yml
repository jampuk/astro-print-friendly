services:
  # Production: serves the static Astro build (dist/) via nginx on http://localhost:8080
  # Usage:
  #   docker compose up --build app        # build + serve production
  #   docker compose up --build -d app     # detached
  #   docker compose down                  # stop
  app:
    build:
      context: .
      target: production
      args:
        PUBLIC_PAPER_SIZE: ${PUBLIC_PAPER_SIZE:-}
        PUBLIC_PAPER_ORIENTATION: ${PUBLIC_PAPER_ORIENTATION:-}
    image: astro-print-friendly:latest
    ports:
      - "8080:80"
    restart: unless-stopped

  # Development: Astro dev server with HMR on http://localhost:4321
  # Usage:
  #   docker compose --profile dev up --build dev
  dev:
    build:
      context: .
      target: development
    image: astro-print-friendly:dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      PUBLIC_PAPER_SIZE: ${PUBLIC_PAPER_SIZE:-}
      PUBLIC_PAPER_ORIENTATION: ${PUBLIC_PAPER_ORIENTATION:-}
    command: npm run dev -- --host 0.0.0.0 --port 4321
    profiles:
      - dev
